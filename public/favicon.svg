<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19"/>
      <stop offset="50%" stopColor="#111827"/>
      <stop offset="100%" stopColor="#030712"/>
    </linearGradient>

    <!-- Neon Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22D3EE"/>
      <stop offset="50%" stopColor="#6366F1"/>
      <stop offset="100%" stopColor="#EC4899"/>
    </linearGradient>

    <!-- Text Neon Gradient for LIO -->
    <linearGradient id="lioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#818CF8"/>
      <stop offset="100%" stopColor="#F472B6"/>
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#6366F1" stopOpacity="0.35"/>
      <stop offset="60%" stopColor="#06B6D4" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#6366F1" floodOpacity="0.5"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#000000" floodOpacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" filter="url(#neonGlow)"/>
  
  <!-- Subtle Internal Glow Mesh -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#centerGlow)"/>

  <!-- Specular Top Rim Reflection -->
  <path d="M 60 40 Q 256 20 452 40" stroke="white" stroke-opacity="0.25" stroke-width="3" fill="none"/>

  <!-- Central Emblem: "Đăng LIO" Typography -->
  <g filter="url(#textShadow)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    <!-- "Đ" Main Glyph -->
    <text x="256" y="275" font-size="210" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
      Đ
    </text>

    <!-- Neon Accent Crossbar for "Đ" -->
    <rect x="156" y="172" width="92" height="18" rx="9" fill="#22D3EE" filter="drop-shadow(0 0 8px #06B6D4)"/>

    <!-- Sparkle on the corner of Đ -->
    <circle cx="360" cy="120" r="6" fill="#F472B6" filter="drop-shadow(0 0 6px #F472B6)"/>
    <path d="M 360 102 L 360 138 M 342 120 L 378 120" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>

    <!-- "LIO" Futuristic Sub-Typography -->
    <text x="256" y="380" font-size="78" font-weight="900" fill="url(#lioGrad)" letter-spacing="14" filter="drop-shadow(0 0 12px rgba(129,140,248,0.6))">
      LIO
    </text>

    <!-- Tiny Sub-kicker badge: "CREATIVE" -->
    <text x="256" y="425" font-size="22" font-weight="700" fill="#94A3B8" letter-spacing="8" opacity="0.85">
      CREATIVE
    </text>
  </g>
</svg>
